<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Driver Drowsiness Alert</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="preconnect" href="https://storage.googleapis.com">
<style>
  body {
    font-family: system-ui, sans-serif;
    background: #344e41;
    color: #dad7cd;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px;
  }
  h1 { font-size: 1.3rem; margin-bottom: 4px; }
  p.sub { color: #bfd8bd; margin-top: 0; font-size: 0.9rem; }
  .video-row {
    display: flex;
    gap: 16px;
    align-items: flex-start;
    margin: 16px 0;
    flex-wrap: wrap;
    justify-content: center;
  }
  .video-box {
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 0 0 3px #588157;
    background: #000;
  }
  #video {
    transform: scaleX(-1);
    display: block;
  }
  #eye-crop-canvas {
    display: block;
  }
  .box-label {
    text-align: center;
    font-size: 0.75rem;
    color: #bfd8bd;
    margin-top: 4px;
  }
  #label-container { font-size: 1.1rem; margin-top: 8px; min-height: 60px; }
  .label-row { display: flex; justify-content: space-between; width: 320px; padding: 4px 0; }
  #status {
    font-size: 1.4rem;
    font-weight: 700;
    padding: 14px 24px;
    border-radius: 10px;
    margin-top: 12px;
    transition: background 0.2s;
    background: #25a18e;
    text-align: center;
  }
  #status.alert {
    background: #dc2626;
    animation: pulse 0.6s infinite alternate;
  }
  @keyframes pulse {
    from { box-shadow: 0 0 0px 0px rgba(220,38,38,0.6); }
    to   { box-shadow: 0 0 25px 10px rgba(220,38,38,0.6); }
  }
  button {
    background: #5b8e7d;
    color: white;
    border: none;
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 1rem;
    cursor: pointer;
    margin-top: 10px;
  }
  button:hover { background: #f4a259; }
   button:disabled { opacity: 0.5; cursor: not-allowed; }
   <!-- =====  ===== -->
  #calib-msg { margin-top: 8px; font-size: 0.95rem; color: #fbbf24; min-height: 1.2em; text-align: center; }
  #score-line { margin-top: 6px; font-size: 0.85rem; color: #dad7cd; }
   <!-- =====  ===== -->
  #config {
    font-size: 0.8rem;
    color: #dad7cd;
    margin-top: 20px;
    max-width: 380px;
    text-align: center;
  }
</style>
</head>
<body>

<h1> Driver Drowsiness Detection</h1>
<p class="sub">✧ now with automatic eye localization ✧</p>

<button id="start-btn">Start Camera</button>
  <!-- =====  ===== -->
<button id="calibrate-btn" disabled>Calibrate (recommended)</button>
<div id="calib-msg"></div>
   <!-- =====  ===== -->
<div class="video-row">
  <div>
    <div class="video-box"><video id="video" width="320" height="240" autoplay playsinline muted></video></div>
    <div class="box-label">Full camera view</div>
  </div>
  <div>
    <div class="video-box"><canvas id="eye-crop-canvas" width="300" height="90"></canvas></div>
    <div class="box-label">Cropped eye region (what the model sees)</div>
  </div>
</div>

<div id="label-container"></div>
  <!-- =====  ===== -->
  <div id="score-line"></div>
  <!-- =====  ===== -->
<div id="status">Waiting to start…</div>

<div id="config">
  ✧ prevention is better than cure ✧
  ✧ preventing a accident is better than bills ✧
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>

<script type="module">
 // MediaPipe Face Landmarker — used only to locate the eyes, not to classify anything
  import { FaceLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

  // ====== CONFIG — EDIT THESE ======
  const MODEL_URL = "https://teachablemachine.withgoogle.com/models/XXXXXXXXX/";
  const CLOSED_CLASS_NAME = "Closed";
  const CONFIDENCE_THRESHOLD = 0.5;        // CHANGED (was 0.75) — fallback only; calibration overrides it
  const CONSECUTIVE_FRAMES_NEEDED = 10;    // CHANGED (was 15) — about 2 seconds of closed eyes at 5 checks/sec

  // How much extra space to include around the detected eye area (bigger = looser crop)
  const CROP_PADDING_FACTOR = 0.6;

  // Try "GPU" first; on some laptops (especially integrated graphics) "CPU" actually
  // starts up faster and runs just as fast for a model this small — test both.
  const DELEGATE = "GPU";

  // Higher capture resolution = more real detail in the small eye region once cropped.
  // Detection only runs ~5 times/sec (see setInterval below), so this shouldn't cause lag.
  const CAPTURE_WIDTH = 640;
  const CAPTURE_HEIGHT = 480;
  // ==================================

  // Landmark indices around the left and right eyes (MediaPipe's 478-point face mesh)
  const LEFT_EYE = [33, 7, 163, 144, 145, 153, 154, 155, 133, 173, 157, 158, 159, 160, 161, 246];
  const RIGHT_EYE = [263, 249, 390, 373, 374, 380, 381, 382, 362, 398, 384, 385, 386, 387, 388, 466];
  const ALL_EYE_POINTS = LEFT_EYE.concat(RIGHT_EYE);

  let model, maxPredictions, labelContainer;
  let faceLandmarker;
  let video, eyeCanvas, eyeCtx;
  let closedStreak = 0;
  let audioCtx;
  let lastNoFaceWarn = 0;
  let recentConfidences = []; // rolling window used to smooth out frame-to-frame jitter
  const SMOOTHING_WINDOW = 3;  // CHANGED (was 4) — reacts a little faster to real eye closure

  // ===== NEW: calibration state =====
  let activeThreshold = CONFIDENCE_THRESHOLD; // replaced by the calibrated value once you run Calibrate
  let calibrating = null;                     // when set, detection just collects samples instead of alerting
  // ===== END NEW =====

  async function init() {
    document.getElementById("start-btn").disabled = true;
    const statusEl = document.getElementById("status");
    statusEl.innerText = "Loading face detector…";

    // 1. Load the face landmark model (runs locally in-browser, no data leaves the device)
    const filesetResolver = await FilesetResolver.forVisionTasks(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
    );
    faceLandmarker = await FaceLandmarker.createFromOptions(filesetResolver, {
      baseOptions: {
        modelAssetPath:
          "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
        delegate: DELEGATE
      },
      runningMode: "VIDEO",
      numFaces: 1
    });

    // 2. Load your Teachable Machine model
    statusEl.innerText = "Loading your Teachable Machine model…";
    model = await tmImage.load(MODEL_URL + "model.json", MODEL_URL + "metadata.json");
    maxPredictions = model.getTotalClasses();

    labelContainer = document.getElementById("label-container");
    labelContainer.innerHTML = "";
    for (let i = 0; i < maxPredictions; i++) {
      const row = document.createElement("div");
      row.className = "label-row";
      labelContainer.appendChild(row);
    }

    // 3. Start the raw webcam feed ourselves (so we can pass real frames to MediaPipe)
    statusEl.innerText = "Requesting camera…";
    video = document.getElementById("video");
    eyeCanvas = document.getElementById("eye-crop-canvas");
    eyeCtx = eyeCanvas.getContext("2d");
    eyeCtx.imageSmoothingEnabled = true;
    eyeCtx.imageSmoothingQuality = "high";

    const stream = await navigator.mediaDevices.getUserMedia({ video: { width: CAPTURE_WIDTH, height: CAPTURE_HEIGHT } });
    video.srcObject = stream;
    await video.play();

    document.getElementById("calibrate-btn").disabled = false; // NEW
    statusEl.innerText = "Monitoring…";
    // Run detection ~5 times per second instead of on every animation frame (~60/sec).
    // Drowsiness detection doesn't need more than this, and it massively cuts CPU/GPU load.
    setInterval(detectAndPredict, 200);
  }

  let busy = false;
  async function detectAndPredict() {
    if (video.readyState < 2) return; // video not ready yet
    if (busy) return; // skip this tick if the previous one hasn't finished yet
    busy = true;
    try {
      await runDetection();
    } finally {
      busy = false;
    }
  }

  async function runDetection() {

    const results = faceLandmarker.detectForVideo(video, performance.now());
    const statusEl = document.getElementById("status");

    if (!results.faceLandmarks || results.faceLandmarks.length === 0) {
      // No face found this frame — don't count it either way, just let the user know
      if (performance.now() - lastNoFaceWarn > 1000) {
        statusEl.innerText = "No face detected — face the camera";
        statusEl.classList.remove("alert");
        lastNoFaceWarn = performance.now();
      }
      return;
    }

    const landmarks = results.faceLandmarks[0];
    const box = getEyeBoundingBox(landmarks, video.videoWidth, video.videoHeight);

    // Draw the cropped eye region (mirrored to match the visible video) into the small canvas
    eyeCtx.save();
    eyeCtx.scale(-1, 1);
    eyeCtx.drawImage(
      video,
      box.x, box.y, box.width, box.height,
      -eyeCanvas.width, 0, eyeCanvas.width, eyeCanvas.height
    );
    eyeCtx.restore();

    // Feed ONLY the cropped eye region into your Teachable Machine model
    const prediction = await model.predict(eyeCanvas);
    let closedConfidence = 0;

    for (let i = 0; i < maxPredictions; i++) {
      const p = prediction[i];
      const row = labelContainer.childNodes[i];
      row.innerText = `${p.className}: ${(p.probability * 100).toFixed(1)}%`;
      if (p.className === CLOSED_CLASS_NAME) closedConfidence = p.probability;
    }

    // ===== NEW: during calibration, just record the raw closed-eye score and stop here =====
    const scoreEl = document.getElementById("score-line");
    if (calibrating) {
      calibrating.samples.push(closedConfidence);
      scoreEl.innerText = `Closed score: ${(closedConfidence * 100).toFixed(0)}% (calibrating…)`;
      return;
    }
    // ===== END NEW =====

    // Smooth out single-frame noise by averaging over the last few readings
    recentConfidences.push(closedConfidence);
    if (recentConfidences.length > SMOOTHING_WINDOW) recentConfidences.shift();
    const smoothedConfidence = recentConfidences.reduce((a, b) => a + b, 0) / recentConfidences.length;

    // NEW: live readout so you can see how close the score is to triggering
    scoreEl.innerText = `Closed score: ${(smoothedConfidence * 100).toFixed(0)}% | alert threshold: ${(activeThreshold * 100).toFixed(0)}%`;

    if (smoothedConfidence >= activeThreshold) {   // CHANGED (was CONFIDENCE_THRESHOLD)
      closedStreak++;
    } else {
      closedStreak = 0;
      statusEl.classList.remove("alert");
      statusEl.innerText = "Monitoring… eyes open";
    }

    if (closedStreak >= CONSECUTIVE_FRAMES_NEEDED) {
      triggerAlert();
      statusEl.innerText = "⚠️ DROWSINESS DETECTED ⚠️";
      statusEl.classList.add("alert");
    }
  }

  // Turns the eye landmark points into a padded pixel bounding box on the raw video frame,
  // then expands it to match the output canvas's aspect ratio so nothing gets stretched.
  function getEyeBoundingBox(landmarks, videoWidth, videoHeight) {
    let minX = 1, minY = 1, maxX = 0, maxY = 0;
    for (const idx of ALL_EYE_POINTS) {
      const pt = landmarks[idx];
      if (pt.x < minX) minX = pt.x;
      if (pt.y < minY) minY = pt.y;
      if (pt.x > maxX) maxX = pt.x;
      if (pt.y > maxY) maxY = pt.y;
    }

    let x = minX * videoWidth;
    let y = minY * videoHeight;
    let width = (maxX - minX) * videoWidth;
    let height = (maxY - minY) * videoHeight;

    const padX = width * CROP_PADDING_FACTOR;
    const padY = height * CROP_PADDING_FACTOR;
    x -= padX; y -= padY;
    width += padX * 2; height += padY * 2;

    // Grow the box (never shrink) so its aspect ratio matches the eyeCanvas exactly —
    // this avoids ever stretching the image when it's drawn in.
    const targetRatio = eyeCanvas.width / eyeCanvas.height;
    const currentRatio = width / height;
    if (currentRatio < targetRatio) {
      const newWidth = height * targetRatio;
      x -= (newWidth - width) / 2;
      width = newWidth;
    } else {
      const newHeight = width / targetRatio;
      y -= (newHeight - height) / 2;
      height = newHeight;
    }

    // Clamp to the video frame
    x = Math.max(0, Math.min(x, videoWidth - width));
    y = Math.max(0, Math.min(y, videoHeight - height));
    width = Math.min(width, videoWidth);
    height = Math.min(height, videoHeight);

    return { x, y, width, height };
  }

  function triggerAlert() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "square";
    osc.frequency.value = 880;
    gain.gain.value = 0.15;
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.3);
    if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
  }

  // ===== NEW: calibration =====
  // Measures what YOUR model outputs for your open eyes and your closed eyes, then sets the
  // alert threshold halfway between the two. This balances sensitivity for both states
  // instead of relying on a fixed number that may not suit your model.
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  async function collectAverage(ms) {
    calibrating = { samples: [] };
    await sleep(ms);
    const samples = calibrating.samples;
    calibrating = null;
    if (samples.length === 0) return null; // no face was detected during this window
    return samples.reduce((a, b) => a + b, 0) / samples.length;
  }

  async function runCalibration() {
    const btn = document.getElementById("calibrate-btn");
    const msg = document.getElementById("calib-msg");
    btn.disabled = true;

    msg.innerText = "Step 1/2: keep your eyes OPEN and look at the camera…";
    await sleep(2000);
    const openAvg = await collectAverage(3000);

    msg.innerText = "Step 2/2: now CLOSE your eyes firmly and hold…";
    await sleep(2000);
    const closedAvg = await collectAverage(3000);

    if (openAvg === null || closedAvg === null) {
      msg.innerText = "No face detected during calibration — face the camera and try again.";
      btn.disabled = false;
      return;
    }

    // Halfway point between "open" and "closed" scores, kept away from the extremes
    activeThreshold = Math.min(0.95, Math.max(0.05, (openAvg + closedAvg) / 2));
    recentConfidences = [];
    closedStreak = 0;

    const gap = closedAvg - openAvg;
    msg.innerText =
      `Calibrated: open ≈ ${(openAvg * 100).toFixed(0)}%, closed ≈ ${(closedAvg * 100).toFixed(0)}% → threshold ${(activeThreshold * 100).toFixed(0)}%` +
      (gap < 0.15
        ? " ⚠️ The model barely tells open from closed — it likely needs retraining with better eye-crop images."
        : "");
    btn.disabled = false;
  }

  document.getElementById("calibrate-btn").addEventListener("click", runCalibration);
  // ===== END NEW =====

  document.getElementById("start-btn").addEventListener("click", init);
</script>

</body>
</html>
